<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome...</title>
  <style>

    body {
      background-color: #000000;
      font-family: Georgia, serif;

    }

    h1 {
      margin-top: 20px;
      color: #fff;
      font-family: 'Medodica Regular', Georgia, serif;
    }

    .box {
      display: inline-block;
      margin: 20px auto;

    }
    .box img {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;

    .enter-button {
      display: inline-block;
      margin: 20px auto;
      padding: 10px 30px;
      background: rgb(219, 90, 140);
      color: rgb(255, 255, 255);
      font-weight: bold;
      font-size: 20px;
      text-decoration: none;
    }

    .enter-button:hover {
      background: #aa3356;
    }

    hr {
      border: none;
      border-top: 2px dotted rgb(0, 0, 0);
      margin: 20px auto;
      width: 80%;
    }

    .warning {
      font-size: 14px;
      margin: 10px auto;
      width: 70%;
      color: #fff;
    }

    .warning b {
      font-weight: bold;
    }

    .note {
      font-size: 12px;
      color: #ffffff;
      margin-top: 5px;
    }
  </style>
</head>
